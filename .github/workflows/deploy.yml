name: 배포

# main 에 올라간 것만 배포합니다. 손으로도 돌릴 수 있게 workflow_dispatch 를 함께 둡니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 배포에 필요한 최소 권한입니다. id-token 은 배포 액션이 요구합니다.
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치지 않게 합니다. 진행 중인 것을 취소하지 않는 이유는 중간 상태로
# 끝난 배포가 사이트에 남는 편이 더 나쁘기 때문입니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 생성물을 커밋하지 않으므로 문서 변환이 빌드보다 먼저 돌아야 합니다.
      # package.json 의 prebuild 훅이 docs:build 를 부르므로 여기서는 build 만 부릅니다.
      - run: npm ci

      - run: npm run build

      # 정적 호스팅에서 알 수 없는 경로는 404.html 로 응답합니다. 앱의 not-found
      # 화면을 그대로 복사해 두 경로가 같은 화면을 보이게 맞춥니다.
      - name: 404 화면 배치
        run: cp dist/blog/browser/not-found/index.html dist/blog/browser/404.html

      # Pages 는 기본적으로 Jekyll 을 거칩니다. 밑줄로 시작하는 파일이 사라지는 것을
      # 막기 위해 꺼 둡니다. 지금 산출물에는 해당 파일이 없지만 생기면 조용히 깨집니다.
      - name: Jekyll 비활성화
        run: touch dist/blog/browser/.nojekyll

      # 서버 산출물은 올리지 않습니다. 전 경로가 프리렌더라 browser 만으로 서빙됩니다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/blog/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
